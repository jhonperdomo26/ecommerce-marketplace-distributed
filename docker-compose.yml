# PostgreSQL + pgAdmin para desarrollo local.
# El Manual Técnico (Paso 1) admite PostgreSQL nativo o un contenedor de Docker.
#
#   docker compose up -d      # levantar
#   docker compose down       # detener (conserva los datos)
#   docker compose down -v    # detener y BORRAR los datos (re-ejecuta los .sql)

services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comercio_electronico
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Los scripts se ejecutan en orden alfabético SOLO al inicializar el volumen.
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/03_constraints.sql:/docker-entrypoint-initdb.d/03_constraints.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comercio_electronico"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:
