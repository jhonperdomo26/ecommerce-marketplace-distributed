# nginx: sirve la SPA y reenvía /api a la API (servicio "api" de docker-compose.prod.yml).
# Con esto navegador y API comparten origen: no hace falta CORS y el token no viaja entre dominios.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad. OJO: nginx NO hereda los add_header del server en un location que
    # declare alguno propio; por eso se repiten en /assets/ y en /.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # La API usa TRUST_PROXY=1 para leer la IP real del cliente en esta cabecera.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200k;
    }

    # Tienda del cliente: app Flutter compilada para web (servicio "cliente" de docker-compose).
    # Hereda las cabeceras de seguridad del server porque no declara add_header propios.
    location = /app {
        return 301 /app/;
    }
    location /app/ {
        proxy_pass http://cliente:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Archivos con hash en el nombre: se pueden guardar mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Rutas de la SPA (react-router): cualquier otra ruta devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
