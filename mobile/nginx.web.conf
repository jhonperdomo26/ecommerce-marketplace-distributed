# nginx de la tienda del cliente (Flutter web). Solo se llega a él a través del servicio "web",
# que ya añade las cabeceras de seguridad y reenvía /api a la API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    location = /app {
        return 301 /app/;
    }

    # Sin caché: así un despliegue nuevo se ve al recargar (la app no lleva hash en los nombres).
    location /app/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app/index.html;
    }
}
